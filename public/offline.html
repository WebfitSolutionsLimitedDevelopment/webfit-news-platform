<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're offline — Webfit News</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff;color:#101317;font-family:Arial,Helvetica,sans-serif;text-align:center;padding:24px}
  .wrap{max-width:360px}
  img{width:96px;height:96px;margin-bottom:20px}
  h1{font-size:20px;margin:0 0 10px}
  p{font-size:14px;line-height:1.5;color:#667085;margin:0 0 20px}
  button{border:0;background:#0b1117;color:#fff;padding:12px 20px;border-radius:8px;font-weight:700;font-size:14px}
</style>
</head>
<body>
  <div class="wrap">
    <img src="/icon-192.png" alt="Webfit News" />
    <h1>You're offline</h1>
    <p>Webfit News couldn't load. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
